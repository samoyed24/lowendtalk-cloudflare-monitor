name: Uninstall from Cloudflare Workers

# 只支持手动触发：删除本仓库部署的 Worker 与它的 KV（整服务一起删）。
# 需要输入固定确认串，防止误触发。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入确认串 delete-lowendtalk-cloudflare-monitor 以执行删除'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delete-${{ github.ref }}
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验必填参数
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少必填 Secrets:$missing（见 README 卸载一节）"
            exit 1
          fi

      - name: 确认目标账号
        run: npx wrangler whoami

      - name: 删除 Worker 与 KV
        run: node scripts/teardown.mjs --confirm="$CONFIRM"

      - name: 删除结果
        run: |
          echo "### 卸载完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 已删除 Worker 与它的 KV namespace" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "需要重新部署时，回到 Deploy workflow 手动运行即可。" >> "$GITHUB_STEP_SUMMARY"
